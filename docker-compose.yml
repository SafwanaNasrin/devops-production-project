services:

  blue:
    build: .
    container_name: app_blue
    environment:
      APP_VERSION: "1.0.0"
      APP_COLOR: "blue"
    expose:
      - "5000"

  green:
    build: .
    container_name: app_green
    environment:
      APP_VERSION: "2.0.0"
      APP_COLOR: "green"
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: devops_nginx
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - blue
      - green
